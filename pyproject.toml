[project]
name = "rag-cli"
version = "0.1.0"
description = "Terminal RAG assistant for answering developer questions from project docs."
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.2",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "pypdf>=4.2",
]

[project.scripts]
rag = "rag_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_cli*"]
